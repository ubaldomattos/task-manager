<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Controle pessoal de tarefas organizado por calendário">
    <title>Task Manager</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script>
        // Aplica o tema antes da renderização para evitar o "piscar" do tema errado.
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('taskmanager.theme'); } catch (e) { /* armazenamento indisponível */ }
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
<header class="app-header">
    <div class="app-header__inner">
        <h1 class="app-title">
            <svg class="app-title__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="17" rx="3"/>
                <path d="M3 9h18M8 2v4M16 2v4M8.5 14.5l2.2 2.2 4.8-4.8"/>
            </svg>
            Task Manager
        </h1>
        <button type="button" id="theme-toggle" class="icon-button" aria-label="Alternar tema">
            <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
            </svg>
        </button>
    </div>
</header>

<main class="layout">
    <section class="card calendar" aria-labelledby="month-title">
        <div class="calendar__header">
            <button type="button" id="prev-month" class="icon-button" aria-label="Mês anterior">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <h2 id="month-title" class="calendar__title" aria-live="polite"></h2>
            <button type="button" id="next-month" class="icon-button" aria-label="Próximo mês">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </button>
        </div>
        <div class="calendar__toolbar">
            <button type="button" id="today-button" class="button button--ghost">Hoje</button>
            <p class="calendar__legend">
                <span class="legend-dot legend-dot--pending" aria-hidden="true"></span> Com pendências
                <span class="legend-dot legend-dot--done" aria-hidden="true"></span> Tudo concluído
            </p>
        </div>
        <div class="calendar__weekdays" aria-hidden="true">
            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
        </div>
        <div id="calendar-grid" class="calendar__grid"></div>
    </section>

    <section class="card tasks" aria-labelledby="selected-date">
        <header class="tasks__header">
            <h2 id="selected-date" class="tasks__title"></h2>
            <p id="task-counter" class="tasks__counter"></p>
        </header>

        <form id="task-form" class="task-form" novalidate>
            <label class="visually-hidden" for="task-title">Título da nova tarefa</label>
            <input id="task-title" name="title" type="text" class="input" maxlength="120"
                   placeholder="Nova tarefa" autocomplete="off" required>
            <label class="visually-hidden" for="task-description">Descrição (opcional)</label>
            <textarea id="task-description" name="description" class="input input--textarea" maxlength="1000"
                      rows="2" placeholder="Descrição (opcional)"></textarea>
            <button type="submit" class="button button--primary">Adicionar tarefa</button>
        </form>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>
        <p id="task-empty" class="tasks__empty" hidden>Nenhuma tarefa para este dia.</p>
    </section>
</main>

<dialog id="edit-dialog" class="dialog" aria-labelledby="edit-dialog-title">
    <form id="edit-form" class="dialog__form" method="dialog" novalidate>
        <h2 id="edit-dialog-title" class="dialog__title">Editar tarefa</h2>
        <label class="field">
            <span class="field__label">Título</span>
            <input id="edit-title" name="title" type="text" class="input" maxlength="120" required>
        </label>
        <label class="field">
            <span class="field__label">Descrição (opcional)</span>
            <textarea id="edit-description" name="description" class="input input--textarea" maxlength="1000"
                      rows="4"></textarea>
        </label>
        <div class="dialog__actions">
            <button type="button" class="button button--ghost" data-close>Cancelar</button>
            <button type="submit" class="button button--primary">Salvar</button>
        </div>
    </form>
</dialog>

<dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-dialog-title">
    <form class="dialog__form" method="dialog">
        <h2 id="confirm-dialog-title" class="dialog__title">Excluir tarefa</h2>
        <p id="confirm-message" class="dialog__message"></p>
        <div class="dialog__actions">
            <button type="submit" class="button button--ghost" value="cancel">Cancelar</button>
            <button type="submit" class="button button--danger" value="confirm">Excluir</button>
        </div>
    </form>
</dialog>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
